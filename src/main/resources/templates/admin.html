<!DOCTYPE HTML>
<html lang="zh" th:replace="~{layout/main :: layout(~{::markdown}, ~{::scripts},~{::css})}"
      xmlns:th="http://www.thymeleaf.org">
<th:block th:fragment="css">
    <link id="change-codeTheme" rel="stylesheet" th:href="@{/webjars/highlightjs/11.11.1/styles/github.min.css}">
    <link rel="stylesheet" th:href="@{/webjars/katex/0.6.0/dist/katex.min.css}">
</th:block>
<section th:fragment="markdown" class="h-100 d-flex flex-column">
    <div class="row justify-content-center" id="markdownTool">
        <!-- 1. 添加了 w-auto 使容器宽度自适应内容，mx-auto 实现居中 -->
        <!-- 2. 添加了 shadow-sm, border, rounded-pill 让它看起来像个独立的浮动工具栏 -->
        <div class="toolbar d-flex align-items-center justify-content-center p-1 border rounded-pill shadow-sm bg-body-secondary w-auto">

            <div class="btn-group me-1">
                <button class="btn btn-sm bg-body-secondary dropdown-toggle border-0" data-bs-toggle="dropdown" title="标题">
                    <i class="bi bi-type"></i>
                </button>
                <ul class="dropdown-menu" style="min-width: 50px;">
                    <li><a class="dropdown-item" data-action="h1">H1</a></li>
                    <li><a class="dropdown-item" data-action="h2">H2</a></li>
                    <li><a class="dropdown-item" data-action="h3">H3</a></li>
                </ul>
            </div>

            <!-- 使用 btn-group 结合 btn-sm 让按钮更紧凑 -->
            <div class="btn-group">
                <button class="btn btn-sm bg-body-secondary border-0" onclick="test()" data-action="bold" title="加粗"><i class="bi bi-type-bold"></i></button>
                <button class="btn btn-sm bg-body-secondary border-0" data-action="italic" title="斜体"><i class="bi bi-type-italic"></i></button>
                <button class="btn btn-sm bg-body-secondary border-0" data-action="strike" title="删除线"><i class="bi bi-type-strikethrough"></i></button>
                <button class="btn btn-sm bg-body-secondary border-0" data-action="inline-code" title="行内代码"><i class="bi bi-code"></i></button>
                <button class="btn btn-sm bg-body-secondary border-0" data-action="code" title="代码块"><i class="bi bi-file-code"></i></button>
            </div>

            <!-- 竖向分割线 -->
            <div class="vr mx-2 text-muted" style="height: 20px;"></div>

            <div class="btn-group">
                <button class="btn btn-sm bg-body-secondary border-0" data-action="quote"><i class="bi bi-blockquote-left"></i></button>
                <button class="btn btn-sm bg-body-secondary border-0" data-action="ul"><i class="bi bi-list-ul"></i></button>
                <button class="btn btn-sm bg-body-secondary border-0" data-action="task"><i class="bi bi-check2-square"></i></button>
            </div>

            <div class="vr mx-2 text-muted" style="height: 20px;"></div>

            <div class="btn-group">
                <button class="btn btn-sm bg-body-secondary border-0" data-action="link"><i class="bi bi-link-45deg"></i></button>
                    <button class="btn btn-sm bg-body-secondary border-0 dropdown-toggle no-caret"
                            data-bs-toggle="dropdown" aria-expanded="false" title="插入表情">
                        <i class="bi bi-emoji-smile"></i>
                    </button>
                    <!-- 表情下拉面板 -->
                    <ul class="dropdown-menu dropdown-menu-end p-2 emoji-grid" style="min-width: 150px;">
                        <li><button class="dropdown-item p-1" data-action=":grinning:" data-value="">😀 </button></li>
                        <li><button class="dropdown-item p-1" data-action=":smiley:" data-value="😂">😃</button></li>
                        <li><button class="dropdown-item p-1" data-action=":laughing:" data-value="😍">😆</button></li>
                        <li><button class="dropdown-item p-1" data-action=":grin:" data-value="😁">😁</button></li>
<!--                        <li><button class="dropdown-item p-1" data-action="insert-emoji" data-value="👍">👍</button></li>-->
<!--                        <li><button class="dropdown-item p-1" data-action="insert-emoji" data-value="🔥">🔥</button></li>-->
<!--                        <li><button class="dropdown-item p-1" data-action="insert-emoji" data-value="✨">✨</button></li>-->
<!--                        <li><button class="dropdown-item p-1" data-action="insert-emoji" data-value="🎉">🎉</button></li>-->
<!--                        <li><button class="dropdown-item p-1" data-action="insert-emoji" data-value="🤔">🤔</button></li>-->
<!--                        <li><button class="dropdown-item p-1" data-action="insert-emoji" data-value="👀">👀</button></li>-->
<!--                        <li><button class="dropdown-item p-1" data-action="insert-emoji" data-value="🚀">🚀</button></li>-->
<!--                        <li><button class="dropdown-item p-1" data-action="insert-emoji" data-value="💡">💡</button></li>-->
                    </ul>


                <button class="btn btn-sm bg-body-secondary border-0" data-action="undo"><i class="bi bi-arrow-counterclockwise"></i></button>
                <button class="btn btn-sm bg-body-secondary border-0" data-action="fullscreen"><i class="bi bi-arrows-fullscreen"></i></button>
            </div>
        </div>
    </div>
    <div class="row flex-grow-1">
        <div class="col-md-6 d-flex flex-column">
            <!--            <textarea id="editor" class="form-control vh-100"></textarea>-->
            <div class="form-floating ">
                <textarea class="form-control  mb-1" id="editor" placeholder=" "></textarea>
                <label class="fs-6 text-center w-100" for="editor">Markdown 编辑器</label>
            </div>

        </div>

        <div class="col-md-6 d-flex flex-column">
            <div id="preview"></div>
        </div>
    </div>
</section>
<th:block th:fragment="scripts">
    <script th:src="@{/webjars/markdown-it/14.1.0/dist/markdown-it.js}"></script>
    <script th:src="@{/webjars/katex/0.6.0/dist/katex.min.js}"></script>
    <script th:src="@{/webjars/katex/0.6.0/dist/contrib/auto-render.min.js}"></script>
    <script th:src="@{/webjars/highlightjs/11.11.1/highlight.min.js}"></script>
    <script th:src="@{/webjars/markdown-it-emoji/1.4.0/dist/markdown-it-emoji-light.js}"></script>
    <script th:src="@{/webjars/markdown-it-sub/1.0.0/dist/markdown-it-sub.js}"></script>
    <script th:src="@{/webjars/markdown-it-sup/1.0.0/dist/markdown-it-sup.js}"></script>
    <script th:src="@{/webjars/markdown-it-footnote/2.0.0/dist/markdown-it-footnote.js}"></script>
    <script th:src="@{/webjars/markdown-it-deflist/2.1.0/dist/markdown-it-deflist.js}"></script>
    <script th:src="@{/webjars/markdown-it-abbr/1.0.4/dist/markdown-it-abbr.js}"></script>
    <script th:src="@{/webjars/markdown-it-ins/2.0.0/dist/markdown-it-ins.js}"></script>
    <script th:src="@{/webjars/markdown-it-mark/2.0.0/dist/markdown-it-mark.js}"></script>
    <script th:src="@{/js/admin.js}"></script>
</th:block>
</html>
