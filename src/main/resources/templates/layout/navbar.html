<!DOCTYPE html>
<html lang="zh"
      xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity6"
      xmlns:th="http://www.thymeleaf.org">

<nav id="nav" class="navbar navbar-expand-md bg-body-tertiary shadow-sm"
     th:fragment="navbar">

    <div class="container-fluid">

        <!-- LOGO -->
        <a class="navbar-brand border-end pe-3 me-3 fw-semibold" th:href="@{/}">Keep Blog</a>

        <!-- 移动端按钮 -->
        <button class="navbar-toggler"
                data-bs-target="#navbarContent"
                data-bs-toggle="collapse"
                type="button">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div  class="collapse navbar-collapse" id="navbarContent">
            <!-- 左侧菜单 -->
            <ul class="navbar-nav me-auto">

                <li class="nav-item">
                    <a sec:authorize="isAnonymous()" class="nav-link" th:href="@{/}">Home</a>
                    <a sec:authorize-url="/admin/dashboard" class="nav-link" th:href="@{/admin/dashboard}">仪表盘</a>
                </li>

                <li class="nav-item">
                    <a sec:authorize="isAnonymous()" class="nav-link" href="#">Archives</a>
                    <a sec:authorize-url="/admin/blog" class="nav-link" th:href="@{/admin/articles}">文章管理</a>
                </li>

                <li class="nav-item">
                    <a sec:authorize="isAnonymous()" class="nav-link" href="#">Labels</a>
                    <a sec:authorize-url="/admin/blog" class="nav-link" th:href="@{/admin/tags}">标签管理</a>
                </li>

                <li class="nav-item">
                    <a sec:authorize="isAnonymous()" class="nav-link" href="#">Labels</a>
                    <a sec:authorize-url="/admin/blog" class="nav-link" th:href="@{/admin/categories}">分类管理</a>
                </li>

                <li class="nav-item">
                    <a sec:authorize="isAnonymous()" class="nav-link" href="#">About</a>
                    <a sec:authorize-url="/admin/blog" class="nav-link" th:href="@{/admin/comment}">评论管理</a>
                </li>
            </ul>

            <!-- 搜索 -->
            <form class="d-flex me-3" role="search" sec:authorize="isAnonymous()">
                <label>
                    <input class="form-control me-2"
                           placeholder="Search"
                           type="search">
                </label>
                <button class="btn btn-outline-success">
                    <i class="bi bi-search"></i>
                </button>
            </form>

            <!-- 未登录 -->
<!--            <div sec:authorize="isAnonymous()">-->
<!--                <a class="btn btn-outline-primary"-->
<!--                   th:href="@{/login}">-->
<!--                    登录-->
<!--                </a>-->
<!--            </div>-->

            <!-- 已登录 -->
            <div class="dropdown"
                 sec:authorize="isAuthenticated()">

                <button class="btn btn-outline-secondary dropdown-toggle"
                        data-bs-toggle="dropdown">
                    <i class="bi bi-person-circle"></i>
                    <span sec:authentication="name"></span>
                </button>

                <ul class="dropdown-menu dropdown-menu-end">
                    <li>
                        <a class="dropdown-item" th:href="@{/profile}">个人中心</a>
                    </li>
                    <li>
                        <a class="dropdown-item" th:href="@{/editor}">修改密码</a>
                    </li>
                    <li>
                        <hr class="dropdown-divider">
                    </li>
                    <li>
                        <form method="post"
                              th:action="@{/logout}">
                            <button class="dropdown-item">
                                退出登录
                            </button>
                        </form>
                    </li>
                </ul>
            </div>
        </div>
    </div>
</nav>
</html>
