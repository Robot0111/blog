<!DOCTYPE HTML>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main :: layout(~{::tag}, ~{},~{})}">
<section class="row" th:fragment="tag">
    <div class="container-fluid mt-3 mx-auto" >
        <div class="d-flex justify-content-between align-items-center mb-3">
        <div class="d-flex gap-2" style="width: 450px;">
            <div class="input-group input-group-sm">
                <input type="text" id="searchInput" class="form-control" placeholder="输入分类名称搜索...">
                <button class="btn btn-outline-secondary" onclick="loadCategories(1)">搜索</button>
            </div>
            <button class="btn btn-primary btn-sm text-nowrap" data-bs-toggle="modal" data-bs-target="#categoryModal">
                <i class="bi bi-plus-lg"></i> 新增分类
            </button>
        </div>

        <div class="text-muted small">共 <span id="totalCount">0</span> 条记录</div>
    </div>

        <table class="table table-sm table-hover table-bordered align-middle" style="table-layout: fixed;">
            <thead class="small">
            <tr>
                <th style="width: 80px;">ID</th>
                <th style="width: 25%;">分类名称</th>
                <th>描述</th>
                <th style="width: 200px;">创建时间</th>
                <th style="width: 120px;" class="text-center">操作</th>
            </tr>
            </thead>
            <tbody id="categoryTableBody" class="small">
            </tbody>
        </table>

        <nav class="d-flex justify-content-end">
            <ul class="pagination pagination-sm mb-0" id="pagination"></ul>
        </nav>
    </div>

    <div class="modal fade" id="categoryModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">编辑分类</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="categoryForm">
                        <input type="hidden" id="categoryId">
                        <div class="mb-3">
                            <label class="form-label">分类名称</label>
                            <input type="text" id="categoryName" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">描述</label>
                            <textarea id="categoryDesc" class="form-control" rows="3"></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" onclick="saveCategory()">保存</button>
                </div>
            </div>
        </div>
    </div>
    <script>
        let currentPage = 1;
        const pageSize = 15; // 每页显示10条
        // 加载数据
        async function loadCategories(page = 1) {
            currentPage = page; // 更新全局当前页
            const keyword = document.getElementById('searchInput').value;

            const res = await fetch(`/api/categories?page=${page}&size=${pageSize}&keyword=${keyword}`);
            const data = await res.json();

            // 1. 渲染表格内容 (保持原样，注意 ID 和 NAME 大小写)
            renderTable(data.list);

            // 2. 渲染分页按钮
            renderPagination(data.total, page);

            // 这里可以根据 total 计算页码并渲染 pagination 组件
            document.getElementById('totalCount').innerText = data.total;

        }

        function renderTable(list) {
            const tbody = document.getElementById('categoryTableBody');
            tbody.innerHTML = list.map(item => `
        <tr>
            <td>${item.ID}</td>
            <td class="fw-bold">${item.NAME}</td>
            <td class="text-truncate" style="max-width: 200px;">${item.DESCRIPTION || ''}</td>
            <td>${new Date(item.CREATE_TIME).toLocaleString()}</td>
            <td class="text-center">
                <div class="btn-group btn-group-sm">
                    <button class="btn btn-link text-primary p-0 me-2" onclick="editCategory(${item.ID}, '${item.NAME}', '${item.DESCRIPTION}')">编辑</button>
                    <button class="btn btn-link text-danger p-0" onclick="deleteCategory(${item.ID})">删除</button>
                </div>
            </td>
        </tr>
    `).join('');

        }

        function renderPagination(total, activePage) {
            const totalPages = Math.ceil(total / pageSize);
            const paginationUl = document.getElementById('pagination');
            let html = '';

            // 上一页
            html += `<li class="page-item ${activePage === 1 ? 'disabled' : ''}">
                <a class="page-link" href="#" onclick="loadCategories(${activePage - 1})">&laquo;</a>
             </li>`;

            // 循环生成页码
            for (let i = 1; i <= totalPages; i++) {
                html += `<li class="page-item ${i === activePage ? 'active' : ''}">
                    <a class="page-link" href="#" onclick="loadCategories(${i})">${i}</a>
                 </li>`;
            }

            // 下一页
            html += `<li class="page-item ${activePage === totalPages ? 'disabled' : ''}">
                <a class="page-link" href="#" onclick="loadCategories(${activePage + 1})">&raquo;</a>
             </li>`;

            paginationUl.innerHTML = html;
        }

        // 删除确认
       async function deleteCategory(id) {
            if (confirm('确定删除吗？')) {
                const res = await fetch(`/api/categories/${id}`, { method: 'DELETE' });
                if (res.ok) {
                    await loadCategories(currentPage); // 删除后刷新
                } else {
                    const msg = await res.text();
                    alert(msg);
                }
            }
        }
        async function saveCategory() {
            const id = document.getElementById('categoryId').value;
            const payload = {
                id: id,
                name: document.getElementById('categoryName').value,
                description: document.getElementById('categoryDesc').value
            };

            const response = await fetch('/api/categories', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (response.ok) {
                // 关闭模态框并刷新列表
                const modal = bootstrap.Modal.getInstance(document.getElementById('categoryModal'));
                modal.hide();
                await loadCategories(currentPage);
            } else {
                const errorMsg = await response.text();
                alert(errorMsg);
            }
        }

        // 点击编辑按钮时调用的函数
        function editCategory(id, name, desc) {
            document.getElementById('categoryId').value = id;
            document.getElementById('categoryName').value = name;
            document.getElementById('categoryDesc').value = (desc === 'null' ? '' : desc);

            // 显示模态框
            new bootstrap.Modal(document.getElementById('categoryModal')).show();
        }
        // 页面加载完成后立即执行
        document.addEventListener('DOMContentLoaded', function() {
            loadCategories(1); // 初始化加载第一页
        });
    </script>
</section>
</html>
