<!DOCTYPE HTML>
<html th:fragment="layout(content, scripts,css)" lang="zh" xmlns:th="http://www.thymeleaf.org" xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
  <meta charset="UTF-8" content="width=device-width, initial-scale=1" name="viewport">
  <title th:text="博客"></title>
  <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.css}">
  <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/1.13.1/font/bootstrap-icons.css}">
  <link rel="stylesheet" th:href="@{/css/home.css}" type="text/css" />
  <th:block th:replace="${css}"></th:block>
</head>

<body>

  <!-- 顶部导航 -->
  <div th:replace="~{layout/navbar :: navbar}"></div>

  <!-- 主体 -->
  <main class="container mt-4">
    <div th:replace="${content}"></div>

    <button class="theme-fab btn btn-primary rounded-circle shadow" id="themeToggle">
      <i class="bi bi-moon" id="themeIcon"></i>
    </button>

  </main>
  <!-- 页脚 -->
  <div th:replace="~{layout/footer :: footer}"></div>

<script th:src="@{/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js}"></script>
  <!-- 页面专属JS -->
  <th:block th:replace="${scripts}"></th:block>
<script th:src="@{/js/home.js}"></script>
</body>
</html>
