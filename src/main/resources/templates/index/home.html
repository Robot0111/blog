<!DOCTYPE HTML>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main :: layout(~{::cardTxt}, ~{},~{})}">
<section class="row" th:fragment="cardTxt">
    <div class="col-10 mx-auto">
        <div class="row mb-4" th:each="article : ${articles}">
            <div class="card shadow-sm justify-content-center">
                <div class="text-center card-body pt-4 position-relative">

                    <div class="position-absolute top-0 start-0 p-2">
                        <span class="badge  text-secondary fw-normal border"
                              th:text="${article.CATEGORY_NAME ?: '未分类'}">分类</span>
                    </div>

                    <h5 class="card-title mb-3">
                        <a class="text-decoration-none text-body fw-bold"
                           th:href="@{/index/{id}(id=${article.ID})}"
                           th:text="${article.TITLE}">文章标题</a>
                    </h5>

                    <p class="card-text small text-muted mb-0" th:text="${article.SUMMARY}">
                        这里是文章摘要...
                    </p>

                    <div class="text-muted small d-flex gap-3 position-absolute top-0 end-0 p-2 opacity-75">
                        <span>
                            <i class="bi bi-calendar3 me-1"></i>
                            <time th:text="${#dates.format(article.CREATE_TIME, 'yyyy-MM-dd')}">2026-03-10</time>
                        </span>
                        <span><i class="bi bi-eye me-1"></i>[[${article.VIEWS ?: 0}]]</span>
                        <span><i class="bi bi-chat-dots me-1"></i>0</span>
                    </div>
                </div>
            </div>
        </div>

        <div th:if="${#lists.isEmpty(articles)}" class="text-center py-5 text-muted">
            <i class="bi bi-journal-x display-4"></i>
            <p class="mt-2">暂无文章发布</p>
        </div>
    </div>
    <nav aria-label="Page navigation" class="mt-5" th:if="${totalPages > 1}">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${currentPage == 1} ? 'disabled'">
                <a class="page-link" th:href="@{/(page=${currentPage - 1})}" aria-label="Previous">
                    <span aria-hidden="true">&laquo;</span>
                </a>
            </li>

            <li class="page-item"
                th:each="i : ${#numbers.sequence(1, totalPages)}"
                th:classappend="${i == currentPage} ? 'active'">
                <a class="page-link" th:href="@{/(page=${i})}" th:text="${i}">1</a>
            </li>
            <!--            <li class="page-item"-->
            <!--                th:each="i : ${#numbers.sequence(1, totalPages)}"-->
            <!--                th:if="${i >= currentPage - 2 and i <= currentPage + 2}"-->
            <!--                th:classappend="${i == currentPage} ? 'active'">-->
            <!--                ...-->
            <!--            </li>-->

            <li class="page-item" th:classappend="${currentPage == totalPages} ? 'disabled'">
                <a class="page-link" th:href="@{/(page=${currentPage + 1})}" aria-label="Next">
                    <span aria-hidden="true">&raquo;</span>
                </a>
            </li>
        </ul>
    </nav>
</section>
</html>
