<!DOCTYPE HTML>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main :: layout(~{::articleContent}, ~{::scripts},~{::css})}">
<th:block th:fragment="css">
    <link id="change-codeTheme" rel="stylesheet" th:href="@{/webjars/highlightjs/11.11.1/styles/github.min.css}">
    <link rel="stylesheet" th:href="@{/webjars/katex/0.6.0/dist/katex.min.css}">
</th:block>
<section class="row justify-content-center" style="max-height: 100%; overflow-y: auto;" th:fragment="articleContent">
    <div class="col-12 col-lg-10 mx-auto text-truncate shadow-sm d-flex flex-column" style="height: 100%;">

        <header class="flex-shrink-0 border-bottom pb-3 m-2">
            <h1 class="display-6 fw-bold text-truncate mb-3" th:text="${article.TITLE}">文章标题</h1>
            <div class="text-muted small d-flex gap-3">
                  <span><i class="bi bi-folder2-open me-1"></i>[[${article.CATEGORY_ID ?: '未分类'}]]</span>
                  <span><i class="bi bi-calendar3 me-1"></i>[[${#dates.format(article.CREATE_TIME, 'yyyy-MM-dd')}]]</span>
                  <span><i class="bi bi-eye me-1"></i>[[${article.VIEWS ?: 0}]] 次阅读</span>
            </div>
        </header>

<!--        <div class="flex-grow-1" style="overflow-y: auto;">-->
<!--            <article class="article-body  lh-lg " th:utext="${article.CONTENT_HTML}">-->
<!--                这里是文章的正文内容...-->
<!--            </article>-->
<!--        </div>-->
        <div id="content-container" class="flex-grow-1" style="overflow-y: auto; scrollbar-width: thin;">
            <article id="article-render-target" class="article-body lh-lg">
                <div class="text-center py-5">
                    <div class="spinner-border text-primary" role="status"></div>
                </div>
            </article>
        </div>

        <footer class="mt-5 pt-4 border-top">
            <div class="d-flex flex-wrap gap-2">
                <span th:each="tag : ${article.tagIds}"
                      class="badge rounded-pill bg-light text-secondary border">
                      # 标签ID: [[${tag}]]
                </span>
            </div>
        </footer>
    </div>

</section>
<th:block  th:fragment="scripts">
    <script th:inline="javascript">
        const rawMd = /*[[${article.CONTENT_MD}]]*/ '';
        (function() {
            // 使用 DOMContentLoaded 确保 HTML 结构已就绪
            document.addEventListener('DOMContentLoaded', () => {
                renderMarkdown();
            });

            function renderMarkdown() {
                // 检查库是否已加载
                if (typeof window.markdownit === 'undefined') {
                    console.error("markdown-it 未加载，50ms 后重试...");
                    setTimeout(renderMarkdown, 50); // 递归重试
                    return;
                }

                const container = document.getElementById('article-render-target');
                // 获取源码（建议通过隐藏域或全局变量从 HTML 传过来）
                // 1. 获取后端源码


                const md = window.markdownit({
                    html: true,
                    linkify: true,
                    typographer: true,
                    highlight: function (str, lang) {
                        if (lang && hljs.getLanguage(lang)) {
                            try {
                                return '<pre><code class="hljs">' +
                                    hljs.highlight(str, { language: lang, ignoreIllegals: true }).value +
                                    '</code></pre>';
                            } catch (__) {}
                        }
                        return '<pre><code class="hljs">' + md.utils.escapeHtml(str) + '</code></pre>';
                    }
                }).use(window.markdownitEmoji)
                    .use(window.markdownitSub)
                    .use(window.markdownitSup)
                    .use(window.markdownitFootnote)
                    .use(window.markdownitDeflist)
                    .use(window.markdownitAbbr)
                    .use(window.markdownitIns)
                    .use(window.markdownitMark)

                container.innerHTML = md.render(rawMd);

                // 如果有数学公式，渲染完 HTML 后手动触发 KaTeX
                if (typeof renderMathInElement === 'function') {
                    renderMathInElement(container);
                }
            }
        })();

    </script>
</th:block>
</html>
